services:
  chat-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__connect: ${CHAT_DB_CONNECTION:?Set CHAT_DB_CONNECTION in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ChatAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-ChatClient}
      Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  chat-web:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - chat-api
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"

